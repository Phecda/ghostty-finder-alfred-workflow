name: Build Workflow

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - "LICENSE*"
      - ".gitignore"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "LICENSE*"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Alfred Workflow
        run: |
          zip -r GhosttyFinder.alfredworkflow info.plist icon.png *.png -x "*.git*"

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhosttyFinder.alfredworkflow
          path: GhosttyFinder.alfredworkflow

      - name: Publish Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GhosttyFinder.alfredworkflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
